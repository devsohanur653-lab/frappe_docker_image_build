name: Frappe Docker Build
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          repository: frappe/frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create apps.json file
        run: |
          cat > /tmp/apps.json << 'EOF'
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "version-15"
            },
            {
              "url": "https://github.com/frappe/hrms",
              "branch": "version-15"
            },
            {
              "url": "https://github.com/frappe/helpdesk",
              "branch": "v1.24.1"
            }
          ]
          EOF

          echo "=== Verifying apps.json ==="
          cat /tmp/apps.json

      - name: Build and Push Frappe Docker Image
        run: |
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --secret id=apps_json,src=/tmp/apps.json \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg FRAPPE_BRANCH=version-15 \
            --build-arg PYTHON_VERSION=3.11.9 \
            --build-arg NODE_VERSION=18.20.2 \
            --tag devsohanur653/erpnext:helpdesk \
            --file images/custom/Containerfile \
            --push .
